name: Publication integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Hydrate manifest-protected sessions only
        run: git lfs pull --include="$(node scripts/list-protected-session-paths.mjs)"
      - name: Test integrity rules
        run: node --test scripts/publication-integrity.test.mjs
      - name: Verify protected publications
        run: node scripts/verify-publications.mjs
