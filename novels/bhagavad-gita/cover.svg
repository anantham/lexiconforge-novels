<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-label="Bhagavad Gita — the Song of the Lord">
  <!--
    Cover: Bhagavad Gita (Sanskrit mula public domain, sa.wikisource.org;
    English by Swami Swarupananda, 1909, public domain).
    Palette: deep indigo night (Krsna's hue) and saffron/turmeric gold. The
    central motif is the chakra — the chariot-wheel on the field of Kuruksetra
    and the wheel of dharma — with a conch (Pancajanya) beneath. Hand-authored
    SVG, no rasters.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f4a"/>
      <stop offset="0.55" stop-color="#232a5c"/>
      <stop offset="1" stop-color="#141636"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4cf76"/>
      <stop offset="1" stop-color="#d09a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.40" r="0.72">
      <stop offset="0" stop-color="#3a3f86"/>
      <stop offset="1" stop-color="#3a3f86" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1200" fill="url(#bg)"/>
  <rect width="800" height="1200" fill="url(#glow)"/>

  <!-- double gold border -->
  <rect x="34" y="34" width="732" height="1132" fill="none" stroke="#d9a441" stroke-width="3"/>
  <rect x="46" y="46" width="708" height="1108" fill="none" stroke="#d9a441" stroke-width="1" opacity="0.7"/>

  <!-- top lamp-dot frieze -->
  <g fill="#e8bc5e" opacity="0.85">
    <circle cx="250" cy="92" r="4"/><circle cx="300" cy="92" r="4"/><circle cx="350" cy="92" r="4"/>
    <circle cx="400" cy="92" r="6"/>
    <circle cx="450" cy="92" r="4"/><circle cx="500" cy="92" r="4"/><circle cx="550" cy="92" r="4"/>
  </g>

  <!-- ॐ -->
  <text x="400" y="188" text-anchor="middle" fill="url(#gold)"
        font-family="'Noto Serif Devanagari','Sanskrit Text',serif" font-size="72">ॐ</text>

  <!-- ══ the chakra (chariot-wheel / wheel of dharma) ══ -->
  <g transform="translate(400 430)" fill="none" stroke="url(#gold)">
    <circle r="150" stroke-width="6"/>
    <circle r="132" stroke-width="2" opacity="0.7"/>
    <circle r="34" stroke-width="6"/>
    <circle r="10" fill="url(#gold)" stroke="none"/>
    <!-- 24 spokes -->
    <g stroke-width="3" opacity="0.92">
      <line x1="0" y1="-34" x2="0" y2="-132"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(15)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(30)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(45)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(60)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(75)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(90)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(105)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(120)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(135)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(150)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(165)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(180)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(195)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(210)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(225)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(240)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(255)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(270)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(285)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(300)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(315)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(330)"/>
      <line x1="0" y1="-34" x2="0" y2="-132" transform="rotate(345)"/>
    </g>
  </g>

  <!-- conch (Pancajanya) beneath the wheel -->
  <g transform="translate(400 640)">
    <path d="M0 -26 C 26 -22, 34 4, 14 22 C 2 32, -18 30, -28 16
             C -20 22, -6 22, 2 14 C 12 4, 10 -12, 0 -26 Z"
          fill="url(#gold)" stroke="#141636" stroke-width="1.5"/>
    <path d="M-28 16 C -36 22, -40 30, -34 36 L -12 30 Z" fill="url(#gold)" stroke="#141636" stroke-width="1.5"/>
  </g>

  <!-- rule -->
  <line x1="150" y1="770" x2="650" y2="770" stroke="#d9a441" stroke-width="1.5" opacity="0.8"/>

  <!-- title -->
  <text x="400" y="892" text-anchor="middle" fill="#f5e2b8"
        font-family="'Noto Serif Devanagari','Sanskrit Text',serif" font-size="104" font-weight="600">भगवद्गीता</text>
  <text x="400" y="948" text-anchor="middle" fill="#e8bc5e"
        font-family="Cardo,Georgia,serif" font-size="30" letter-spacing="7">BHAGAVAD GĪTĀ</text>
  <text x="400" y="988" text-anchor="middle" fill="#d9a441" opacity="0.9"
        font-family="Cardo,Georgia,serif" font-size="19" font-style="italic">The Song of the Lord</text>

  <!-- author / provenance -->
  <text x="400" y="1064" text-anchor="middle" fill="#f5e2b8" opacity="0.95"
        font-family="'Noto Serif Devanagari','Sanskrit Text',serif" font-size="30">व्यासविरचिता</text>
  <text x="400" y="1098" text-anchor="middle" fill="#d9a441" opacity="0.85"
        font-family="Cardo,Georgia,serif" font-size="16" letter-spacing="2">ATTRIBUTED TO VYĀSA · TRANS. SWARUPANANDA 1909</text>

  <!-- bottom frieze -->
  <g fill="#e8bc5e" opacity="0.7">
    <circle cx="330" cy="1136" r="3"/><circle cx="365" cy="1136" r="3"/>
    <circle cx="400" cy="1136" r="4.5"/>
    <circle cx="435" cy="1136" r="3"/><circle cx="470" cy="1136" r="3"/>
  </g>
</svg>
